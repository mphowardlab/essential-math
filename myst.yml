version: 1
project:
  title: Essential Mathematics for Chemical Engineers
  authors:
    - name: Michael P. Howard
      orcid: 0000-0002-9561-4165
      corresponding: true
      email: mphoward@auburn.edu
      affiliation: Department of Chemical Engineering, Auburn University
  license: CC-BY-SA-4.0
  copyright: "2025-2026"
  github: mphowardlab/essential-math
  math:
    '\d': '\operatorname{d}\!{#1}'
    '\dd': '\frac{\d{}^{#1} #2}{\d{#3}^{#1}}'
    '\pp': '\frac{\partial^{#1} #2}{\partial #3^{#1}}'
    '\td': '\left(\pp{#1}{#2}{#3} \right)_{#4}'
    '\ubar': '\underline{#1}'
    '\vv': '\mathbf{#1}'
  numbering:
    title: true
    heading_1: true
    heading_2: true
